services:
  - type: web
    name: website-image-packager-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: MAX_CONCURRENT_JOBS
        value: 1
      - key: CORS_ORIGINS
        sync: false
